# Optionale HTTPS-Variante (selbstsigniertes Zertifikat im LAN oder Let's Encrypt bei öffentlicher Domain)
# Zertifikat erzeugen (selbstsigniert, 10 Jahre):
#   sudo openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
#     -keyout /etc/ssl/private/contestlogger.key -out /etc/ssl/certs/contestlogger.crt -subj "/CN=contest.local"
server {
    listen 80;
    server_name contest.local _;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name contest.local _;
    ssl_certificate     /etc/ssl/certs/contestlogger.crt;
    ssl_certificate_key /etc/ssl/private/contestlogger.key;
    client_max_body_size 50m;

    location /static/ { alias /opt/contestlogger/contestlogger/static/; expires 1h; }
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
