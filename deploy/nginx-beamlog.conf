# nginx-Site für BeamLog (HTTP im LAN)
# Installation: sudo cp deploy/nginx-beamlog.conf /etc/nginx/sites-available/beamlog
#               sudo ln -s /etc/nginx/sites-available/beamlog /etc/nginx/sites-enabled/
#               sudo rm -f /etc/nginx/sites-enabled/default && sudo nginx -t && sudo systemctl reload nginx
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name contest.local _;

    client_max_body_size 50m;          # Import großer Logs / Backups

    # Statische Dateien direkt von nginx ausliefern
    location /static/ {
        alias /opt/beamlog/contestlogger/static/;
        expires 1h;
    }

    # WebSocket (Live-Updates, Chat)
    location /ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
