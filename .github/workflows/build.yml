name: Portable Builds

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux auf Ubuntu 22.04 (glibc 2.35): das Binary läuft damit auch auf Debian 12 und neuer
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # komplette Historie für die Release-Notes
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest httpx
      - run: python -m pytest -q
      - run: python build_tools/build.py
      - id: ver
        shell: bash
        run: echo "version=$(python -c 'import contestlogger;print(contestlogger.__version__)')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ContestLogger-${{ matrix.os }}
          path: dist/*.zip
      - name: Release-Notes (Änderungen + Commit-Historie seit dem letzten Release)
        shell: bash
        run: python build_tools/release_notes.py "v${{ steps.ver.outputs.version }}" > RELEASE_NOTES.md && cat RELEASE_NOTES.md
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          tag_name: v${{ steps.ver.outputs.version }}
          name: ContestLogger ${{ steps.ver.outputs.version }}
          body_path: RELEASE_NOTES.md
